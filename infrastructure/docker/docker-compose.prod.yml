version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leadora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-crm_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crm_secret_password}
      POSTGRES_DB: ${DB_NAME:-business_crm}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - crm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crm_admin} -d ${DB_NAME:-business_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: leadora_migrate
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-crm_admin}
      DB_PASSWORD: ${DB_PASSWORD:-crm_secret_password}
      DB_NAME: ${DB_NAME:-business_crm}
    command: ["node", "src/database/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm_network
    restart: "no"

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: leadora_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-crm_admin}
      DB_PASSWORD: ${DB_PASSWORD:-crm_secret_password}
      DB_NAME: ${DB_NAME:-business_crm}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - crm_network
    expose:
      - "5000"

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: leadora_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - crm_network

networks:
  crm_network:
    name: leadora_network

volumes:
  postgres_prod_data:
    name: leadora_postgres_data

